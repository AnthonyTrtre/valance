name: Valance
options:
  bundleIdPrefix: fr.anthony
  deploymentTarget: { macOS: "26.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: 20
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JLT7CMPSRQ   # identité Apple Development stable (D004) : ne pas changer, sinon les autorisations TCC sautent
packages:
  Socle:
    path: Socle                 # copie embarquée du socle (le dépôt se compile seul)
  ValanceKit:
    path: ValanceKit            # logique pure (testée par `swift test`, y compris sous Linux)
  # Mises à jour intégrées (MIT), version épinglée : https://github.com/sparkle-project/Sparkle
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Valance:
    type: application
    platform: macOS
    sources: [Sources, Ressources]
    info:
      path: Info.plist
      properties:
        LSUIElement: true            # app de barre de menus, sans icône dans le Dock
        NSHumanReadableCopyright: "© 2026 Utahpik · licence MIT"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"   # croissant d'une version publiée à l'autre : Sparkle s'en sert
        # Mises à jour : flux publié avec chaque Release GitHub, archives signées EdDSA (clé dans le Trousseau).
        SUFeedURL: https://github.com/AnthonyTrtre/valance/releases/latest/download/appcast.xml
        SUPublicEDKey: 90R2Cr4d8ufJofxD0OU+dwH3iAbfKore1ICebiqyc7I=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true    # téléchargées en arrière-plan, installées à la fermeture
        SUScheduledCheckInterval: 21600
        SUVerifyUpdateBeforeExtraction: true
        # Aucune clé d'usage : l'Accessibilité et l'Enregistrement de l'écran n'en demandent pas (elles ne sont
        # demandées que si l'utilisateur active la fonction).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.anthony.valance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO       # l'Accessibilité vers d'autres apps et la lecture de la barre sont incompatibles avec le bac à sable
    dependencies:
      - package: Socle
        product: SocleCore
      - package: Socle
        product: SocleBarreDeMenus
      - package: ValanceKit
        product: ValanceCoeur
      - package: Sparkle
        product: Sparkle
  ValanceTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Valance
      - package: ValanceKit
        product: ValanceCoeur
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.anthony.valance.tests
schemes:
  Valance:
    build:
      targets:
        Valance: all
        ValanceTests: [test]
    test:
      targets: [ValanceTests]
